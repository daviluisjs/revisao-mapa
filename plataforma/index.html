<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Protótipo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400..700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/apexcharts@3.54.1/dist/apexcharts.min.js"></script><style>/* Protótipo da plataforma. Poucas superfícies grandes, linhas finas no lugar de caixas, um destaque por painel. */
:root {
  color-scheme: dark;
  --fundo: #0a0a0b;
  --s1: #101012;
  --s2: #151517;
  --s3: #1c1c1f;
  --s4: #26262a;
  --sobre: #1a1a1d;
  --linha: rgba(244, 244, 245, 0.07);
  --linha2: rgba(244, 244, 245, 0.13);
  --tinta: #f4f4f5;
  --tinta2: #c2c2c9;
  --tinta3: #8e8e97;
  --tinta4: #6a6a73;
  --ouro: #f3bc56;
  --ouro-escuro: #b57a10;
  --bom: #46d593;
  --ruim: #fe7873;
  --lateral: 248px;
  --barra: 68px;
  --gaveta: 448px;
  --baixo: 0px;
  --sombra: inset 0 1px 0 rgba(244, 244, 245, 0.04), 0 28px 56px -32px rgba(0, 0, 0, 0.9);
  --sombra-pop: 0 0 0 1px var(--linha2), 0 30px 70px -20px rgba(0, 0, 0, 0.85);
  /* A tela de entrada (versão cifrada) usa estes nomes. */
  --cartao: var(--s2);
  --borda: var(--linha);
  --borda2: var(--linha2);
  --texto: var(--tinta);
  --suave: var(--tinta3);
  --trava: var(--ruim);
}

* {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

html {
  background: var(--fundo);
}

html[data-tela="funil"] {
  overflow: hidden;
}

body {
  margin: 0;
  background: var(--fundo);
  color: var(--tinta);
  font: 400 14px/20px "Onest", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

h1,
h2,
h3,
p,
dl,
dd,
ul,
ol,
figure {
  margin: 0;
}

ul,
ol {
  padding: 0;
  list-style: none;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font: inherit;
  color: inherit;
}

code {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 12px;
}

img[data-c]:not([src]) {
  background: var(--s3);
}

.ico {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

/* O anel de foco é neutro: dourado em volta de um item parecia item marcado. */
:focus-visible {
  outline: 2px solid rgba(244, 244, 245, 0.5);
  outline-offset: 2px;
}

.selo {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--ouro);
  color: #16130e;
  font: 600 16px "Onest", sans-serif;
}

/* ---------- casca ---------- */

.app {
  display: grid;
  grid-template-columns: var(--lateral) minmax(0, 1fr);
  min-height: 100dvh;
  transition: grid-template-columns 0.2s cubic-bezier(0.23, 1, 0.32, 1);
}

/* Lateral. O símbolo, os ícones e o avatar ficam no mesmo eixo (a 20px da borda de dentro): recolher só corta os
   nomes, nada muda de lugar pro lado. */
.lateral {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  flex-direction: column;
  gap: 2px;
  height: 100dvh;
  padding: 12px;
}

.lateral-topo {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 40px;
  margin-bottom: 8px;
}

/* O logo inteiro; recolhida, a lateral corta ele na largura do símbolo. */
.marca {
  flex: none;
  width: 170px;
  height: 22px;
  margin-left: 11px;
  overflow: hidden;
}

.marca .logo {
  display: block;
  width: auto;
  height: 22px;
}

.lateral .botao-ico:hover {
  background: var(--s2);
}

.nav {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 2px;
}

.nav a,
.conta-sair {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 32px;
  padding: 0 8px;
  border-radius: 8px;
  color: var(--tinta2);
  font-weight: 500;
}

.nav a {
  padding: 0 10px;
  transition: transform 0.12s cubic-bezier(0.23, 1, 0.32, 1);
}

.nav a:active,
.conta:active {
  transform: scale(0.98);
}

/* O nome encolhe junto com a lateral, sem quebrar linha. */
.nav a span {
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  transition: opacity 0.12s;
}

.nav a .ico {
  width: 20px;
  height: 20px;
}

.nav a .ico,
.conta-sair .ico {
  color: var(--tinta3);
}

.nav a:hover {
  background: var(--s2);
  color: var(--tinta);
}

.nav a:hover .ico {
  color: var(--tinta2);
}

.conta-sair:hover {
  background: var(--s3);
  color: var(--tinta);
}

.nav a.ativo {
  background: var(--s2);
  color: var(--tinta);
}

.nav a.ativo .ico {
  color: var(--ouro);
}

.lateral-pe {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: auto;
  padding-top: 8px;
}

.conta-area {
  position: relative;
}

.conta {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  height: 48px;
  padding: 0 8px 0 4px;
  border: 0;
  border-radius: 8px;
  background: none;
  text-align: left;
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.12s cubic-bezier(0.23, 1, 0.32, 1);
}

.conta > .conta-txt {
  transition: opacity 0.12s;
}

.conta:hover,
.conta[aria-expanded="true"] {
  background: var(--s2);
}

/* A seta de trocar fica colada no nome: a linha de baixo fica com a largura toda pro endereço. */
.conta-nome {
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
}

.conta-nome .ico {
  width: 14px;
  height: 14px;
  color: var(--tinta4);
}

.avatar {
  display: grid;
  place-items: center;
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--s4);
  color: var(--tinta2);
  font-size: 11px;
  font-weight: 600;
}

.conta > .avatar {
  width: 32px;
  height: 32px;
  background: var(--s3);
  font-size: 12px;
}

.conta-txt {
  display: grid;
  flex: 1;
  min-width: 0;
}

.conta-txt b {
  overflow: hidden;
  font-weight: 500;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.conta-txt small {
  overflow: hidden;
  color: var(--tinta3);
  font-size: 12px;
  line-height: 16px;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.conta-menu {
  position: absolute;
  left: 0;
  bottom: calc(100% + 6px);
  z-index: 60;
  width: 264px;
  padding: 6px;
  border-radius: 12px;
  background: var(--sobre);
  box-shadow: var(--sombra-pop);
}

.conta-menu button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  height: 48px;
  padding: 0 8px;
  border: 0;
  border-radius: 8px;
  background: none;
  text-align: left;
  cursor: pointer;
}

.conta-menu button:hover {
  background: var(--s3);
}

.conta-menu button > .ico {
  width: 16px;
  height: 16px;
  visibility: hidden;
}

.conta-menu button[aria-selected="true"] > .ico {
  visibility: visible;
}

.conta-sair {
  margin-top: 6px;
  padding-top: 0;
  box-shadow: 0 -1px 0 var(--linha);
  border-radius: 0 0 8px 8px;
}

.miolo {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: calc(100dvh - 16px);
  margin: 8px 8px 8px 0;
  border-radius: 16px;
  background: var(--s1);
  box-shadow: inset 0 0 0 1px var(--linha);
  overflow: clip;
}

.barra {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: var(--barra);
  padding: 0 40px;
  border-radius: 16px 16px 0 0;
  background: var(--s1);
  box-shadow: inset 0 1px 0 var(--linha), inset 1px 0 0 var(--linha), inset -1px 0 0 var(--linha);
}

.barra h1 {
  font-size: 24px;
  font-weight: 650;
  line-height: 30px;
  letter-spacing: -0.022em;
}

.demo {
  color: var(--tinta4);
  font-size: 12px;
  cursor: help;
}

.filtros {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}

.vivo-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 32px;
  padding: 0 10px;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--tinta3);
  font-size: 13px;
  cursor: pointer;
}

.vivo-chip:hover {
  background: var(--s2);
}

.vivo-chip b {
  color: var(--tinta);
  font-weight: 600;
}

.pulso {
  flex-shrink: 0;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--bom);
}

html.vivo-parado .pulso {
  background: var(--tinta4);
}

.periodo {
  display: inline-flex;
  padding: 2px;
  border-radius: 10px;
  background: var(--s2);
  box-shadow: inset 0 0 0 1px var(--linha);
}

.periodo button {
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--tinta3);
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
}

.periodo button:hover {
  color: var(--tinta);
}

.periodo button[aria-pressed="true"] {
  background: var(--s4);
  color: var(--tinta);
}

html[data-tela="conexoes"] .periodo {
  display: none;
}

.tela {
  padding: 4px 40px 48px;
}

.abas-baixo {
  display: none;
}

/* ---------- peças ---------- */

.painel {
  min-width: 0;
  padding: 20px 24px;
  border-radius: 20px;
  background: var(--s2);
  box-shadow: inset 0 0 0 1px var(--linha), var(--sombra);
}

.painel-cab {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.painel-cab h2 {
  font-size: 17px;
  font-weight: 600;
  line-height: 24px;
  letter-spacing: -0.01em;
}

.mini {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--tinta3);
  font-size: 13px;
  font-weight: 400;
  line-height: 18px;
}

.link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--tinta2);
  font-size: 13px;
  font-weight: 500;
}

.link:hover {
  color: var(--tinta);
}

.link .ico {
  width: 15px;
  height: 15px;
  color: var(--tinta3);
}

.botao-ico {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--tinta3);
  cursor: pointer;
}

.botao-ico:hover {
  background: var(--s3);
  color: var(--tinta);
}

.figura-g b {
  font-size: 44px;
  font-weight: 600;
  line-height: 48px;
  letter-spacing: -0.035em;
}

.figura-m {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.figura-m b {
  font-size: 28px;
  font-weight: 600;
  line-height: 32px;
  letter-spacing: -0.025em;
}

.figura-m span {
  color: var(--tinta3);
  font-size: 13px;
}

.variacao {
  color: var(--tinta3);
  font-size: 13px;
  line-height: 18px;
}

.delta.sobe {
  color: var(--bom);
}

.delta.desce {
  color: var(--ruim);
}

/* Números pequenos lado a lado, separados por uma linha fina. */
.stats {
  display: flex;
}

.stats > div {
  padding: 0 20px;
  box-shadow: inset 1px 0 0 var(--linha);
}

.stats > div:last-child {
  padding-right: 0;
}

.stats dt {
  color: var(--tinta3);
  font-size: 12px;
  line-height: 16px;
  white-space: nowrap;
}

.stats dd {
  margin-top: 2px;
  font-size: 15px;
  font-weight: 600;
  line-height: 20px;
  white-space: nowrap;
}

.stats.larga {
  margin-top: 16px;
  padding-top: 16px;
  box-shadow: inset 0 1px 0 var(--linha);
}

.stats.larga > div {
  flex: 1;
}

.stats.larga > div:first-child,
.stats.quatro > div:first-child {
  padding-left: 0;
  box-shadow: none;
}

.stats.dupla {
  display: grid;
  grid-template-columns: 1fr 1fr;
}

.stats.dupla > div {
  padding: 12px 0 12px 16px;
}

.stats.dupla > div:nth-child(odd) {
  padding-left: 0;
  box-shadow: none;
}

.stats.dupla > div:nth-child(n + 3) {
  box-shadow: inset 1px 0 0 var(--linha), inset 0 1px 0 var(--linha);
}

.stats.dupla > div:nth-child(n + 3):nth-child(odd) {
  box-shadow: inset 0 1px 0 var(--linha);
}

.stats.dupla dd {
  font-size: 20px;
  line-height: 26px;
  letter-spacing: -0.015em;
}

.stats.quatro {
  justify-content: space-between;
}

.stats.quatro > div {
  padding: 0 0 0 14px;
}

.medidor {
  height: 3px;
  overflow: hidden;
  border-radius: 2px;
  background: var(--linha);
}

.medidor i {
  display: block;
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: var(--ouro);
  transition: width 0.42s cubic-bezier(0.23, 1, 0.32, 1);
}

.pulsa.mudou {
  animation: mudou 0.9s ease-out;
}

@keyframes mudou {
  0% {
    color: var(--ouro);
  }
}

/* ---------- visão geral ---------- */

.geral {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 24px;
  max-width: 1240px;
  margin-inline: auto;
}

.p-ganho {
  grid-column: span 8;
}

.p-agora {
  grid-column: span 4;
  display: flex;
  flex-direction: column;
}

.p-funil {
  grid-column: span 12;
}

.p-produtos {
  grid-column: span 7;
}

.p-origens {
  grid-column: span 5;
  align-self: start;
}

.ganho-topo {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 8px;
}

.ganho-topo .figura-g {
  margin: 6px 0 4px;
}

/* Gráfico de linhas */
.g-barra {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 32px;
}

.g-legenda {
  display: flex;
  gap: 16px;
  color: var(--tinta2);
  font-size: 13px;
}

.g-legenda span {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.traco {
  width: 12px;
  height: 2px;
  border-radius: 1px;
  background: var(--ouro);
}

.traco.cinza {
  background: #8a8a94;
}

.g-area {
  margin: 0 -10px 0 -14px;
}

.g-tabela,
.grafico.em-tabela .g-area {
  display: none;
}

.grafico.em-tabela .g-tabela {
  display: block;
  max-height: 300px;
  overflow: auto;
}

.g-tabela table,
.tabela {
  width: 100%;
  border-collapse: collapse;
}

.g-tabela th,
.g-tabela td,
.tabela th,
.tabela td {
  height: 44px;
  padding: 0 12px;
  box-shadow: inset 0 1px 0 var(--linha);
  font-weight: 400;
  text-align: right;
  white-space: nowrap;
}

.g-tabela th:first-child,
.tabela th:first-child {
  padding-left: 0;
  text-align: left;
}

.g-tabela td:last-child,
.g-tabela th:last-child,
.tabela td:last-child,
.tabela th:last-child {
  padding-right: 0;
}

.g-tabela thead th,
.tabela thead th {
  height: 32px;
  box-shadow: none;
  color: var(--tinta3);
  font-size: 12px;
}

.g-tabela thead th {
  position: sticky;
  top: 0;
  background: var(--s2);
}

.apexcharts-tooltip.apexcharts-theme-dark,
.apexcharts-tooltip.apexcharts-theme-light {
  border: 0 !important;
  border-radius: 12px !important;
  background: var(--sobre) !important;
  box-shadow: var(--sombra-pop) !important;
}

.g-pop {
  min-width: 190px;
  padding: 12px;
  color: var(--tinta);
  font: 400 13px/18px "Onest", sans-serif;
}

.g-pop p {
  margin-bottom: 8px;
  color: var(--tinta3);
}

.g-pop div {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
}

.g-pop i {
  width: 12px;
  height: 2px;
  border-radius: 1px;
}

.g-pop span {
  flex: 1;
  color: var(--tinta2);
}

.g-pop b {
  font-weight: 600;
}

/* Agora */
.p-agora .figura-m {
  margin-top: 6px;
}

.mini.sub {
  margin-top: 20px;
}

/* A lista é uma fila: a venda nova entra por cima e a última sai por baixo, as duas cortadas na borda. */
.feed {
  position: relative;
  flex: none;
  margin-top: 4px;
  overflow: hidden;
}

.feed li {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 52px;
  box-shadow: inset 0 -1px 0 var(--linha);
}

.feed li.vazio {
  color: var(--tinta3);
}

.feed div {
  display: grid;
  flex: 1;
  min-width: 0;
}

.feed b {
  overflow: hidden;
  font-weight: 500;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.feed small {
  color: var(--tinta3);
  font-size: 12px;
  line-height: 16px;
}

.feed em {
  font-style: normal;
  font-weight: 600;
  white-space: nowrap;
}

.feed li.saindo {
  position: absolute;
  right: 0;
  left: 0;
}

.agora-pe {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-top: auto;
  padding-top: 14px;
  color: var(--tinta3);
  font-size: 13px;
}

.agora-pe span {
  margin-right: auto;
}

.agora-pe b {
  color: var(--tinta);
  font-weight: 600;
}

.agora-pe i {
  width: 1px;
  height: 12px;
  margin: 0 6px;
  align-self: center;
  background: var(--linha2);
}

/* Funil deitado */
.funil-cols {
  display: grid;
  grid-auto-columns: minmax(0, 1fr);
  grid-auto-flow: column;
}

.funil-col {
  display: grid;
  gap: 2px;
  padding: 0 16px 14px;
  box-shadow: inset 1px 0 0 var(--linha);
}

.funil-col:first-child {
  padding-left: 0;
  box-shadow: none;
}

.funil-col span {
  color: var(--tinta3);
  font-size: 12px;
  line-height: 16px;
}

.funil-col b {
  font-size: 22px;
  font-weight: 600;
  line-height: 28px;
  letter-spacing: -0.02em;
}

.funil-col small {
  color: var(--tinta3);
  font-size: 12px;
  line-height: 16px;
}

.funil-col:hover span {
  color: var(--tinta);
}

.funil-svg {
  display: block;
  width: 100%;
  height: 150px;
}

.funil-faixa {
  transition: d 0.42s cubic-bezier(0.23, 1, 0.32, 1);
}

.funil-div {
  stroke: var(--linha);
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
}

/* Produtos e origens */
.tabela-rola {
  position: relative;
  overflow-x: auto;
}

.tabela {
  min-width: 440px;
}

.tabela tbody th,
.tabela tbody td {
  height: 56px;
}

.tabela tbody th {
  font-weight: 500;
  white-space: normal;
}

.tabela small {
  display: block;
  color: var(--tinta3);
  font-size: 12px;
  font-weight: 400;
  line-height: 16px;
}

.tabela b {
  font-weight: 400;
}

.tabela .forte b,
.tabela tfoot b {
  font-weight: 600;
}

.tabela tfoot th {
  font-weight: 500;
}

.origens a {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 10px;
  padding: 14px 0 0;
}

.origens li + li a {
  margin-top: 14px;
  box-shadow: inset 0 1px 0 var(--linha);
}

.origens .ico {
  color: var(--tinta3);
}

.origens a > span {
  font-weight: 500;
}

.origens small {
  color: var(--tinta3);
  font-size: 13px;
}

.origens b {
  min-width: 58px;
  font-weight: 600;
  text-align: right;
}

.origens .medidor {
  grid-column: 1 / -1;
}

.origens a:hover > span {
  color: var(--ouro);
}

/* ---------- conexões ---------- */

.conexoes {
  display: grid;
  gap: 24px;
  max-width: 920px;
  margin-inline: auto;
}

.cx-lista li,
.cx-links li {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 64px;
}

.cx-lista li + li,
.cx-links li + li {
  box-shadow: inset 0 1px 0 var(--linha);
}

.cx-lista .ico,
.cx-links .ico {
  color: var(--tinta3);
}

.cx-lista div {
  display: grid;
  flex: 1;
  min-width: 0;
}

.cx-lista b,
.cx-links b {
  font-weight: 500;
}

.cx-lista small,
.cx-detalhe {
  color: var(--tinta3);
  font-size: 13px;
}

.cx-detalhe b {
  color: var(--tinta2);
}

.estado {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-width: 150px;
  color: var(--tinta2);
  font-size: 13px;
}

.estado i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--bom);
}

.cx-links b {
  width: 110px;
}

.cx-links code {
  flex: 1;
  overflow: hidden;
  color: var(--tinta3);
  white-space: nowrap;
  text-overflow: ellipsis;
}

.cx-links .botao-ico .ico {
  width: 16px;
  height: 16px;
  color: inherit;
}

/* ---------- canvas ---------- */

.tela-mapa {
  position: relative;
  height: calc(100dvh - 16px - var(--barra) - var(--baixo));
  padding: 0;
  overflow: hidden;
  box-shadow: inset 0 1px 0 var(--linha);
}

.canvas {
  position: absolute;
  inset: 0;
  overflow: hidden;
  touch-action: none;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  background-color: var(--fundo);
  background-image: radial-gradient(circle, rgba(243, 188, 86, 0.2) 1px, transparent 1.5px);
  background-size: 26px 26px;
}

.canvas.arrastando {
  cursor: grabbing;
}

.canvas-mundo {
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
  will-change: transform;
}

.canvas.animando .canvas-mundo {
  transition: transform 0.26s cubic-bezier(0.23, 1, 0.32, 1);
}

.faixa {
  position: absolute;
  border-radius: 28px;
  box-shadow: inset 0 0 0 1px rgba(244, 244, 245, 0.05);
}

.faixa span {
  position: absolute;
  left: 24px;
  top: 18px;
  color: var(--tinta4);
  font-size: 14px;
  font-weight: 500;
}

.arestas {
  position: absolute;
  left: 0;
  top: 0;
  overflow: visible;
  pointer-events: none;
}

.aresta {
  fill: none;
  stroke-linecap: round;
  transition: stroke-width 0.42s;
}

.aresta.principal {
  stroke: rgba(243, 188, 86, 0.6);
}

.aresta.fonte {
  stroke: rgba(243, 188, 86, 0.34);
}

.aresta.sim {
  stroke: rgba(70, 213, 147, 0.7);
}

.aresta.nao {
  stroke: rgba(142, 142, 151, 0.5);
}

.aresta.ramo {
  stroke: rgba(243, 188, 86, 0.48);
  stroke-dasharray: 8 8;
}

.fluxo {
  fill: none;
  stroke-linecap: round;
  stroke-dasharray: 0.1 24;
  animation: fluir 1.4s linear infinite;
}

.fluxo.principal,
.fluxo.fonte,
.fluxo.ramo {
  stroke: #fbd88a;
}

.fluxo.sim {
  stroke: #9be9c3;
}

.fluxo.nao {
  stroke: #d4d4d8;
  opacity: 0.5;
}

@keyframes fluir {
  to {
    stroke-dashoffset: -24.1;
  }
}

html.vivo-parado .fluxo {
  animation-play-state: paused;
}

.seta.ouro {
  fill: rgba(243, 188, 86, 0.9);
}

.seta.fonte {
  fill: rgba(243, 188, 86, 0.5);
}

.seta.verde {
  fill: rgba(70, 213, 147, 0.9);
}

.seta.cinza {
  fill: rgba(142, 142, 151, 0.7);
}

.ponto {
  fill: #fff3d1;
}

.ponto.sim {
  fill: #d7f7e7;
}

.ponto.nao {
  fill: #e4e4e7;
}

.rotulos {
  position: absolute;
  left: 0;
  top: 0;
  pointer-events: none;
}

.rotulo {
  position: absolute;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 30px;
  padding: 0 12px;
  border-radius: 15px;
  background: var(--sobre);
  box-shadow: inset 0 0 0 1px var(--linha2);
  color: var(--tinta3);
  font-size: 13px;
  white-space: nowrap;
  transform: translate(-50%, -50%);
}

.rotulo b {
  color: var(--tinta);
  font-size: 14px;
  font-weight: 600;
}

.voa {
  position: absolute;
  height: 30px;
  padding: 0 12px;
  border-radius: 15px;
  background: var(--ouro);
  color: #16130e;
  font-size: 15px;
  font-weight: 600;
  line-height: 30px;
  white-space: nowrap;
  transform: translate(-50%, -100%);
  animation: voar 2.4s cubic-bezier(0.23, 1, 0.32, 1) forwards;
}

@keyframes voar {
  0% {
    opacity: 0;
    transform: translate(-50%, -70%);
  }
  12% {
    opacity: 1;
    transform: translate(-50%, -120%);
  }
  75% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: translate(-50%, -250%);
  }
}

.no {
  position: absolute;
  width: 300px;
  border-radius: 20px;
  background: var(--s2);
  box-shadow: inset 0 0 0 1px var(--linha2), 0 24px 48px -24px rgba(0, 0, 0, 0.8);
  cursor: pointer;
}

.no:hover {
  box-shadow: inset 0 0 0 1px rgba(244, 244, 245, 0.28), 0 24px 48px -24px rgba(0, 0, 0, 0.8);
}

.no:focus-visible {
  outline: 2px solid var(--ouro);
  outline-offset: 4px;
}

.no.ativo {
  box-shadow: inset 0 0 0 1.5px var(--ouro), 0 24px 48px -24px rgba(0, 0, 0, 0.8);
}

.no.recebe .no-cab .ico {
  animation: mudou 0.8s ease-out;
}

.no-tela {
  position: relative;
  height: 204px;
  margin: 6px 6px 0;
  overflow: hidden;
  border-radius: 14px;
  background: var(--fundo);
}

.no.baixo .no-tela {
  height: 136px;
}

.no-tela img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
  pointer-events: none;
  -webkit-user-drag: none;
}

.no-preco {
  position: absolute;
  left: 10px;
  bottom: 10px;
  height: 26px;
  padding: 0 10px;
  border-radius: 8px;
  background: rgba(10, 10, 11, 0.86);
  box-shadow: inset 0 0 0 1px var(--linha2);
  font-size: 13px;
  font-weight: 600;
  line-height: 26px;
}

.no-corpo,
.no.origem {
  padding: 16px 18px 18px;
}

.no-cab {
  display: flex;
  align-items: center;
  gap: 10px;
}

.no-cab .ico {
  width: 20px;
  height: 20px;
  color: var(--tinta3);
}

.no h3 {
  flex: 1;
  font-size: 18px;
  font-weight: 600;
  line-height: 24px;
  letter-spacing: -0.012em;
}

.no-agora {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--tinta4);
  font-size: 13px;
}

.no-agora i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--tinta4);
}

.no-agora b {
  font-weight: 500;
}

.no-agora.tem {
  color: var(--tinta2);
}

.no-agora.tem i {
  background: var(--bom);
}

.no-nums {
  display: grid;
  grid-template-columns: 1fr 1fr;
  margin-top: 14px;
}

.no-nums div + div {
  padding-left: 16px;
  box-shadow: inset 1px 0 0 var(--linha);
}

.no-nums b {
  display: block;
  font-size: 28px;
  font-weight: 600;
  line-height: 32px;
  letter-spacing: -0.025em;
  white-space: nowrap;
}

.no-nums span {
  display: block;
  margin-top: 2px;
  color: var(--tinta3);
  font-size: 13px;
  line-height: 18px;
  white-space: nowrap;
}

.no-lista {
  margin-top: 14px;
}

.no-lista div,
.no-ganho {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 34px;
  box-shadow: inset 0 1px 0 var(--linha);
  color: var(--tinta2);
}

.no-lista b,
.no-ganho b {
  color: var(--tinta);
  font-weight: 600;
}

.no-ganho {
  margin: 14px 0 -8px;
  height: 38px;
}

.no-lista + .no-ganho {
  margin-top: 0;
}

.no.origem {
  width: 264px;
}

.no.origem .no-nums b {
  font-size: 24px;
  line-height: 30px;
}

.canvas.v .no.origem {
  width: 176px;
  padding: 14px 14px 16px;
}

.canvas.v .no.origem .no-nums {
  grid-template-columns: 1fr;
}

.canvas.v .no.origem .no-nums div + div {
  display: none;
}

/* Por cima do canvas */
.passos,
.controles,
.minimapa {
  position: absolute;
  z-index: 5;
  border-radius: 12px;
  background: var(--sobre);
  box-shadow: var(--sombra-pop);
}

.passos {
  left: 16px;
  top: 16px;
  display: flex;
  max-width: calc(100% - 32px);
  padding: 4px;
  overflow-x: auto;
  scrollbar-width: none;
}

.passos::-webkit-scrollbar {
  display: none;
}

.passos button {
  flex-shrink: 0;
  height: 28px;
  padding: 0 11px;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--tinta3);
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
}

.passos button:hover {
  color: var(--tinta);
}

.passos button.ativo {
  background: var(--s4);
  color: var(--tinta);
}

.controles {
  right: 16px;
  bottom: 16px;
  display: flex;
  align-items: center;
  padding: 4px;
  transition: right 0.26s;
}

.controles button {
  display: grid;
  place-items: center;
  min-width: 28px;
  height: 28px;
  padding: 0 4px;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--tinta3);
  cursor: pointer;
}

.controles button:hover {
  background: var(--s4);
  color: var(--tinta);
}

.controles .ico {
  width: 16px;
  height: 16px;
}

.zoom-valor {
  min-width: 48px !important;
  font-size: 12px;
  font-weight: 500;
}

.minimapa {
  right: 16px;
  top: 16px;
  width: 196px;
  padding: 8px;
  cursor: pointer;
  touch-action: none;
}

.minimapa svg {
  display: block;
  width: 100%;
  height: auto;
  max-height: 110px;
}

.mm-faixa {
  fill: rgba(244, 244, 245, 0.03);
}

.mm-no {
  fill: rgba(244, 244, 245, 0.3);
}

.mm-no.ativo {
  fill: var(--ouro);
}

.mm-vista {
  fill: rgba(244, 244, 245, 0.05);
  stroke: var(--tinta2);
  stroke-width: 12;
}

html.com-gaveta .controles {
  right: calc(var(--gaveta) + 32px);
}

html.com-gaveta .passos {
  max-width: calc(100% - var(--gaveta) - 48px);
}

html.com-gaveta .minimapa {
  display: none;
}

/* ---------- gaveta ---------- */

.gaveta {
  position: fixed;
  top: calc(var(--barra) + 24px);
  right: 24px;
  bottom: 24px;
  z-index: 15;
  display: flex;
  flex-direction: column;
  width: var(--gaveta);
  max-width: calc(100vw - 16px);
  border-radius: 16px;
  background: var(--sobre);
  box-shadow: var(--sombra-pop);
  overflow: hidden;
}

.gaveta-alca {
  display: none;
}

.gaveta-fechar {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 1;
}

.gaveta-rolagem {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 24px 24px 32px;
}

.g-cab {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding-right: 36px;
}

.g-cab .ico {
  width: 22px;
  height: 22px;
  margin-top: 3px;
  color: var(--tinta3);
}

.g-cab h2 {
  font-size: 22px;
  font-weight: 650;
  line-height: 28px;
  letter-spacing: -0.02em;
}

.g-cab p {
  color: var(--tinta3);
  font-size: 13px;
  line-height: 18px;
}

.g-topo {
  display: grid;
  grid-template-columns: 112px minmax(0, 1fr);
  gap: 20px;
  margin-top: 20px;
}

.g-tela {
  overflow: hidden;
  border-radius: 14px;
  background: var(--fundo);
  box-shadow: 0 0 0 1px var(--linha2);
  aspect-ratio: 390 / 844;
}

.g-tela img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
}

.g-lado {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: flex-start;
}

.g-lado .stats {
  width: 100%;
}

.gaveta-no > .stats.dupla {
  margin-top: 16px;
}

.g-sec {
  margin-top: 28px;
}

.g-sec h3 {
  margin-bottom: 10px;
  font-size: 14px;
  font-weight: 600;
  line-height: 20px;
}

.g-linhas {
  display: grid;
  gap: 12px;
  counter-reset: linha;
}

.g-linhas li {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 6px 12px;
}

.g-linhas.numerada li {
  counter-increment: linha;
}

.g-linhas.numerada .g-rot::before {
  content: counter(linha);
  display: inline-block;
  width: 22px;
  color: var(--tinta4);
  font-size: 12px;
}

.g-rot {
  color: var(--tinta2);
}

.g-val {
  display: inline-flex;
  align-items: baseline;
  gap: 10px;
  white-space: nowrap;
}

.g-val b {
  min-width: 52px;
  font-weight: 600;
  text-align: right;
}

.g-val small {
  display: inline-flex;
  gap: 8px;
  color: var(--tinta3);
  font-size: 12px;
}

.queda {
  color: var(--tinta4);
  font-style: normal;
}

.g-linhas .medidor {
  grid-column: 1 / -1;
}

.g-produtos li {
  padding: 12px 0;
}

.g-produtos li + li {
  box-shadow: inset 0 1px 0 var(--linha);
}

.g-produtos p {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
}

.g-produtos p b {
  font-weight: 500;
}

.g-produtos p small {
  color: var(--tinta3);
  font-size: 13px;
}

.g-link code {
  display: block;
  color: var(--tinta3);
  overflow-wrap: anywhere;
}

.gaveta .g-area {
  margin: 0 -8px 0 -12px;
}

.gaveta .g-tabela thead th {
  background: var(--sobre);
}

/* ---------- telas menores ---------- */

/* Lateral recolhida: só os ícones. O script põe a classe quando a pessoa recolhe, nas telas médias e, por padrão,
   na tela do canvas, pra ele ocupar quase a janela toda. */
html.trilho {
  --lateral: 64px;
}

html.trilho .lateral-topo {
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-start;
  gap: 5px;
}

html.trilho .marca {
  width: 18.4px;
  margin-top: 9px;
}

html.trilho .lateral-topo .botao-ico {
  margin-left: 4px;
}

html.trilho .nav a span,
html.trilho .conta > .conta-txt {
  opacity: 0;
}

/* Com a lateral recolhida, o nome aparece ao lado do ícone. */
html.trilho .lateral [data-dica] {
  position: relative;
}

html.trilho .lateral [data-dica]::after {
  content: attr(data-dica);
  position: absolute;
  left: calc(100% + 14px);
  top: 50%;
  padding: 4px 8px;
  border-radius: 8px;
  background: var(--sobre);
  box-shadow: var(--sombra-pop);
  color: var(--tinta);
  font-size: 12px;
  font-weight: 500;
  line-height: 16px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transform: translate(-4px, -50%);
  transition: opacity 0.12s, transform 0.12s;
}

html.trilho .lateral [data-dica]:hover::after,
html.trilho .lateral [data-dica]:focus-visible::after {
  opacity: 1;
  transform: translate(0, -50%);
}

/* Abrir de volta (e a primeira pintura) é na hora: as telas com gráfico já nascem na largura final. */
html.seco .app,
html.seco .lateral * {
  transition: none !important;
  animation: none !important;
}

@media (prefers-reduced-motion: reduce) {
  .app,
  .nav a,
  .conta {
    transition: none;
  }
}

@media (max-width: 1240px) {
  /* Aqui a lateral fica sempre recolhida: o botão de recolher some. */
  #lateral-botao {
    display: none;
  }

  .barra,
  .tela {
    padding-inline: 24px;
  }

  .tela-mapa {
    padding: 0;
  }

  .p-ganho,
  .p-agora,
  .p-produtos,
  .p-origens {
    grid-column: span 12;
  }

  .minimapa {
    display: none;
  }
}

@media (max-width: 720px) {
  :root {
    --barra: 96px;
    --baixo: calc(56px + env(safe-area-inset-bottom));
    --gaveta: 100vw;
  }

  .app {
    display: block;
    padding-bottom: var(--baixo);
  }

  .lateral {
    position: static;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 0;
    height: 52px;
    padding: 0 12px 0 16px;
  }

  .lateral-topo {
    min-height: 0;
    margin: 0;
  }

  .marca {
    width: auto;
    height: 19px;
    margin: 0;
  }

  .marca .logo {
    height: 19px;
  }

  .nav {
    display: none;
  }

  .lateral-pe {
    margin: 0;
    padding: 0;
  }

  /* No topo do celular a conta é só o avatar; o nome e o endereço aparecem no menu. */
  .conta {
    width: auto;
    height: 40px;
    padding: 0 4px;
  }

  .conta > .conta-txt {
    display: none;
  }

  .conta-menu {
    left: auto;
    right: 0;
    top: calc(100% + 6px);
    bottom: auto;
  }

  .miolo {
    min-height: 0;
    margin: 0;
    border-radius: 16px 16px 0 0;
  }

  .barra {
    flex-wrap: wrap;
    align-content: center;
    gap: 8px 10px;
    padding: 0 16px;
  }

  .barra h1 {
    font-size: 20px;
    line-height: 26px;
  }

  .filtros {
    width: 100%;
    margin: 0;
  }

  .vivo-chip {
    padding-left: 0;
  }

  .periodo {
    flex: 1;
  }

  .periodo button {
    flex: 1;
    padding: 0 4px;
  }

  .tela {
    padding: 4px 12px 24px;
  }

  .tela-mapa {
    height: calc(100dvh - 52px - var(--barra) - var(--baixo));
    padding: 0;
  }

  .abas-baixo {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 30;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    height: var(--baixo);
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--fundo);
    box-shadow: inset 0 1px 0 var(--linha);
  }

  .abas-baixo a {
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 2px;

.portao .erro{min-height:20px;margin:12px 0 0;color:var(--trava);font-size:13.5px}</style></head><body>
<div class="portao" id="portao"><form autocomplete="on"><span class="selo">M</span><h1>Protótipo</h1><p>Página fechada. Digita a senha pra abrir.</p>
<input type="text" name="usuario" value="revisao" autocomplete="username" hidden>
<input type="password" name="senha" placeholder="Senha" autocomplete="current-password" required autofocus>

<button type="submit">Entrar</button><p class="erro" role="alert"></p></form></div>
<div id="conteudo"></div>
<script>// Comportamento do protótipo: telas, período, números simulados (inclusive o ao vivo), gráficos, canvas e a gaveta
// de cada etapa. Tudo o que é do funil (nomes, taxas, textos) vem da própria página (#dados), não daqui.
// Roda igual na versão aberta e na cifrada; na cifrada, `window.revisaoImagem` decifra a imagem.
window.revisaoImagem = window.revisaoImagem || (async (ref) => ref);

window.iniciarRevisao = () => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const raiz = document.documentElement;
  const D = JSON.parse($("#dados").textContent);
  const NS = "http://www.w3.org/2000/svg";
  const calmo = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const svgEl = (tag, attrs = {}) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    return n;
  };
  const el = (tag, classe, texto) => {
    const n = document.createElement(tag);
    if (classe) n.className = classe;
    if (texto !== undefined) n.textContent = texto;
    return n;
  };
  const faixa = (n, de = 0) => Array.from({ length: n }, (_, i) => de + i);
  const carregar = (trecho) => {
    for (const img of $$("[data-c]", trecho)) if (!img.getAttribute("src")) window.revisaoImagem(`c:${img.dataset.c}`).then((u) => (img.src = u));
  };
  raiz.classList.add("modo-app");

  // ======================================================================
  // Formatos
  // ======================================================================
  const nf0 = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 0 });
  const nf2 = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const nfc = new Intl.NumberFormat("pt-BR", { notation: "compact", maximumFractionDigits: 1 });
  const fmtN = (v) => nf0.format(Math.round(v));
  const fmtP = (v) => {
    if (!Number.isFinite(v)) return "—";
    const p = v * 100;
    return `${p >= 99.95 || p === 0 ? Math.round(p) : p.toFixed(1).replace(".", ",")}%`;
  };
  const fmtD = (v) => (Number.isFinite(v) ? `R$ ${Math.abs(v) >= 1000 ? nf0.format(Math.round(v)) : nf2.format(v)}` : "—");
  const formatar = (fmt, v) => (fmt === "p" ? fmtP(v) : fmt === "d" ? fmtD(v) : Number.isFinite(v) ? fmtN(v) : "—");
  const eixo = (fmt, v) => (fmt === "p" ? `${Math.round(v * 1000) / 10}%`.replace(".", ",") : `${fmt === "d" ? "R$ " : ""}${v >= 10000 ? nfc.format(v) : nf0.format(v)}`);
  const partir = (s) => {
    const i = s.indexOf(":");
    return [s.slice(0, i), s.slice(i + 1)];
  };

  // Expressões dos números: "campo", "a/b", "a+b", "a-b/c", "origem.campo".
  const compiladas = new Map();
  function compilar(expr) {
    if (!compiladas.has(expr)) {
      const lado = (s) =>
        s.split(/(?=[+-])/).map((t) => {
          const [a, b] = t.replace(/^[+-]/, "").split(".");
          return [t[0] === "-" ? -1 : 1, b ? a : null, b ?? a];
        });
      const [n, d] = expr.split("/");
      compiladas.set(expr, { num: lado(n), den: d ? lado(d) : null });
    }
    return compiladas.get(expr);
  }
  function valor(expr, A) {
    if (!A) return NaN;
    const c = compilar(expr);
    const soma = (termos) => termos.reduce((t, [s, esc, k]) => t + s * ((esc ? A.origens?.[esc]?.[k] : A[k]) ?? 0), 0);
    const n = soma(c.num);
    if (!c.den) return n;
    const d = soma(c.den);
    return d ? n / d : NaN;
  }

  // ======================================================================
  // Números simulados: um dia por vez, sempre igual pro mesmo dia (sorteio com semente)
  // ======================================================================
  const M = D.modelo;
  const HORAS = M.horas.map((h) => h / M.horas.reduce((a, b) => a + b, 0));
  const abriu = new Date();
  const meiaNoite = new Date(abriu.getFullYear(), abriu.getMonth(), abriu.getDate());
  const DIA0 = Math.floor(Date.UTC(abriu.getFullYear(), abriu.getMonth(), abriu.getDate()) / 864e5);
  const HORA0 = abriu.getHours() + abriu.getMinutes() / 60;
  const pesoAte = (h) => {
    let t = 0;
    for (let i = 0; i < 24; i++) {
      if (h >= i + 1) t += HORAS[i];
      else {
        t += HORAS[i] * Math.max(0, h - i);
        break;
      }
    }
    return Math.min(1, t);
  };
  const FRAC0 = pesoAte(HORA0);
  const SOMAS = M.campos.filter((c) => Array.isArray(c[1]));
  const sorteador = (a) => () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  const dias = new Map();
  /** Os campos de cada origem no dia `i` (0 = hoje, 1 = ontem…). */
  function gerarDia(conta, i) {
    const chave = `${conta.id}:${i}`;
    if (dias.has(chave)) return dias.get(chave);
    const semana = new Date(meiaNoite.getTime() - i * 864e5).getDay();
    const tendencia = 1 - conta.crescimento * (Math.min(i, 150) / 150);
    const dia = {};
    D.origens.forEach((o, oi) => {
      const rnd = sorteador(Math.imul(conta.semente, 73856093) ^ Math.imul(DIA0 - i, 19349663) ^ Math.imul(oi + 1, 83492791));
      const ruido = (amp) => 1 + (rnd() * 2 - 1) * amp;
      const c = { s: Math.round(conta.volume * conta.fontes[o.id] * M.semana[semana] * tendencia * ruido(0.06)) };
      for (const [k, de, taxa, amp] of M.campos) {
        if (Array.isArray(de)) c[k] = de.reduce((t, x) => t + c[x], 0);
        else c[k] = Math.min(c[de], Math.round(c[de] * taxa * (o.mult?.[k] ?? 1) * ruido(amp ?? 0.05)));
      }
      dia[o.id] = c;
    });
    dias.set(chave, dia);
    return dia;
  }
  /** Um pedaço do dia (até certa hora). */
  function escalar(c, f) {
    if (f >= 1) return c;
    const r = {};
    for (const k in c) r[k] = Math.round(c[k] * f);
    for (const [k, de] of SOMAS) r[k] = de.reduce((t, x) => t + r[x], 0);
    return r;
  }
  const GRUPO = Object.fromEntries(D.produtos.map((p) => [p.id, p.grupo]));
  const EVENTOS = ["s", ...M.campos.filter((c) => !Array.isArray(c[1])).map((c) => c[0])];
  /** Dinheiro: os totais de cada produto e do período, a partir das linhas de venda. */
  function derivar(o, conta) {
    o.r_total = 0;
    o.c_total = 0;
    o.vendas_itens = 0;
    o.r_ret = 0;
    o.c_ret = 0;
    for (const p of D.produtos) o[`v_${p.id}`] = o[`r_${p.id}`] = o[`c_${p.id}`] = 0;
    for (const l of M.linhas) {
      const q = o[l.k] ?? 0;
      const r = q * l.preco;
      const c = r * conta.parte[GRUPO[l.p]];
      o[`v_${l.p}`] += q;
      o[`r_${l.p}`] += r;
      o[`c_${l.p}`] += c;
      o.r_total += r;
      o.c_total += c;
      o.vendas_itens += q;
      if (l.marca) {
        o[`r_${l.marca}`] += r;
        o[`c_${l.marca}`] += c;
      }
    }
    for (const [k, de] of M.somas) o[k] = de.reduce((t, x) => t + o[x], 0);
    o.eventos = EVENTOS.reduce((t, k) => t + (o[k] ?? 0), 0);
    return o;
  }
  /** Soma vários dias (cada um inteiro ou até certa hora) e, se for o caso, o que entrou ao vivo. */
  function juntar(conta, pares, extras) {
    const A = { origens: {} };
    for (const o of D.origens) {
      const alvo = (A.origens[o.id] = {});
      for (const [dia, f] of pares) {
        const c = escalar(dia[o.id], f);
        for (const k in c) alvo[k] = (alvo[k] ?? 0) + c[k];
      }
      if (extras) for (const k in extras[o.id]) alvo[k] = (alvo[k] ?? 0) + extras[o.id][k];
      for (const k in alvo) A[k] = (A[k] ?? 0) + alvo[k];
      derivar(alvo, conta);
    }
    return derivar(A, conta);
  }

  // ======================================================================
  // Estado
  // ======================================================================
  const lembrado = (() => {
    try {
      return JSON.parse(localStorage.getItem("mr_plataforma") || "{}");
    } catch {
      return {};
    }
  })();
  const lembrar = () => {
    try {
      localStorage.setItem("mr_plataforma", JSON.stringify({ conta: E.conta.id, periodo: E.periodo, recolhida: E.recolhida }));
    } catch {}
  };
  const E = {
    conta: D.contas.find((c) => c.id === lembrado.conta) ?? D.contas[0],
    periodo: ["hoje", "7", "30", "90"].includes(lembrado.periodo) ? lembrado.periodo : "30",
    recolhida: lembrado.recolhida === true,
    tela: null,
    A: null,
    P: null,
    hoje: null,
    ontem: null,
    baldes: [],
  };
  const vivo = { ligado: true, pessoas: [], extras: {}, feed: [], vendas: [], proxima: 0, ultimo: Date.now(), seq: 0, parouEm: 0 };

  function recalcular() {
    const n = E.periodo === "hoje" ? 1 : Number(E.periodo);
    const par = (i, primeiro) => [gerarDia(E.conta, i), i === primeiro ? FRAC0 : 1];
    E.A = juntar(E.conta, faixa(n).map((i) => par(i, 0)), vivo.extras);
    E.P = juntar(E.conta, faixa(n, n).map((i) => par(i, n)));
    E.hoje = n === 1 ? E.A : juntar(E.conta, [par(0, 0)], vivo.extras);
    E.ontem = n === 1 ? E.P : juntar(E.conta, [par(1, 1)]);
    if (n === 1) {
      const dia = gerarDia(E.conta, 0);
      const ate = Math.floor(HORA0);
      let antes = null;
      E.baldes = faixa(ate + 1).map((h) => {
        const f = pesoAte(Math.min(h + 1, HORA0));
        const acumulado = {};
        const pedaco = {};
        for (const o of D.origens) {
          acumulado[o.id] = escalar(dia[o.id], f);
          pedaco[o.id] = {};
          for (const k in acumulado[o.id]) pedaco[o.id][k] = acumulado[o.id][k] - (antes ? antes[o.id][k] : 0);
        }
        antes = acumulado;
        return { rotulo: `${String(h).padStart(2, "0")}h`, A: juntar(E.conta, [[pedaco, 1]], h === ate ? vivo.extras : null) };
      });
    } else {
      // No gráfico de vários dias o dia de hoje fica de fora: ele ainda está pela metade e faria a linha despencar.
      E.baldes = faixa(n - 1, 1)
        .reverse()
        .map((i) => {
          const d = new Date(meiaNoite.getTime() - i * 864e5);
          return { rotulo: `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`, A: juntar(E.conta, [par(i, 0)], i === 0 ? vivo.extras : null) };
        });
    }
  }
  const noEscopo = (A, esc) => (esc?.startsWith("origem:") ? A?.origens[esc.slice(7)] : A);
  function escopoDe(no) {
    const esc = no.closest("[data-escopo]")?.dataset.escopo;
    if (esc === "hoje") return { A: E.hoje, P: E.ontem, esc };
    return { A: noEscopo(E.A, esc), P: noEscopo(E.P, esc), esc };
  }

  // ======================================================================
  // Preencher os números da página
  // ======================================================================
  let animar = false;
  const pulsar = (no) => {
    no.classList.remove("mudou");
    void no.offsetWidth;
    no.classList.add("mudou");
  };
  function preencher(trecho) {
    if (!trecho) return;
    for (const no of $$("[data-m]", trecho)) {
      const [fmt, expr] = partir(no.dataset.m);
      let v = valor(expr, escopoDe(no).A);
      if (no.dataset.vezes) v *= Number(no.dataset.vezes);
      const texto = formatar(fmt, v);
      if (no.textContent !== texto) {
        no.textContent = texto;
        if (animar && no.classList.contains("pulsa")) pulsar(no);
      }
    }
    const grupos = new Map();
    for (const no of $$("[data-w]", trecho)) {
      const v = valor(no.dataset.w, escopoDe(no).A);
      if (no.dataset.wg) {
        if (!grupos.has(no.dataset.wg)) grupos.set(no.dataset.wg, []);
        grupos.get(no.dataset.wg).push([no, Number.isFinite(v) ? v : 0]);
      } else no.style.width = `${Math.max(0, Math.min(100, (Number.isFinite(v) ? v : 0) * 100))}%`;
    }
    for (const itens of grupos.values()) {
      const max = Math.max(...itens.map(([, v]) => v), 1e-9);
      for (const [no, v] of itens) no.style.width = `${Math.max(0, (v / max) * 100)}%`;
    }
    for (const no of $$("[data-delta]", trecho)) {
      const [fmt, expr] = partir(no.dataset.delta);
      const { A, P } = escopoDe(no);
      const a = valor(expr, A);
      const b = valor(expr, P);
      let texto = "—";
      let classe = "igual";
      if (Number.isFinite(a) && Number.isFinite(b) && b) {
        const dif = fmt === "p" ? (a - b) * 100 : ((a - b) / b) * 100;
        const mod = Math.abs(dif).toFixed(1).replace(".", ",");
        classe = Math.abs(dif) < 0.05 ? "igual" : dif > 0 ? "sobe" : "desce";
        texto = `${classe === "sobe" ? "▲" : classe === "desce" ? "▼" : "•"} ${mod}${fmt === "p" ? " p.p." : "%"}`;
      }
      no.textContent = texto;
      no.className = `delta ${classe}`;
    }
    for (const no of $$("[data-queda]", trecho)) {
      const v = valor(no.dataset.queda, escopoDe(no).A);
      no.textContent = Number.isFinite(v) ? `▾ ${fmtP(1 - v)}` : "";
    }
  }

  // ======================================================================
  // Gráficos: linhas com o ApexCharts; o funil é desenhado aqui
  // ======================================================================
  const COR = { ouro: "#f3bc56", cinza: "#8a8a94" };
  const TINTA3 = "#8e8e97";
  const escapar = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  function seriesDe(caixa) {
    const esc = escopoDe(caixa).esc;
    return caixa.dataset.linhas.split(";").map((s) => {
      const [def, nome, cor] = s.split("|");
      const [fmt, expr] = partir(def);
      return {
        nome,
        cor,
        fmt,
        valores: E.baldes.map((b) => {
          const v = valor(expr, noEscopo(b.A, esc));
          return Number.isFinite(v) ? Math.round(v * 10000) / 10000 : 0;
        }),
      };
    });
  }
  const montados = new Map();
  function tabelaDe(caixa, series) {
    const alvo = $(".g-tabela", caixa);
    alvo.textContent = "";
    const t = el("table");
    const cab = t.createTHead().insertRow();
    cab.append(el("th", "", E.periodo === "hoje" ? "Hora" : "Dia"));
    for (const s of series) cab.append(el("th", "", s.nome));
    const corpo = t.createTBody();
    for (let i = E.baldes.length - 1; i >= 0; i--) {
      const tr = corpo.insertRow();
      tr.append(el("th", "", E.baldes[i].rotulo));
      for (const s of series) tr.append(el("td", "", formatar(s.fmt, s.valores[i])));
    }
    alvo.append(t);
  }
  /** Monta (na primeira vez) ou atualiza o gráfico de linhas de uma caixa. */
  function desenharGrafico(caixa, suave = false) {
    const series = seriesDe(caixa);
    const rotulos = E.baldes.map((b) => b.rotulo);
    const fmt = series[0].fmt;
    let g = montados.get(caixa);
    if (!g) {
      // Legenda (com 2 séries ou mais), botão da tabela, o gráfico e a tabela.
      const barra = el("div", "g-barra");
      const legenda = el("div", "g-legenda");
      if (series.length > 1)
        for (const s of series) {
          const item = el("span", "", s.nome);
          item.prepend(el("i", `traco ${s.cor}`));
          legenda.append(item);
        }
      const alternar = el("button", "botao-ico g-alternar");

    const aviso = $(".dica-canvas");
    const nos = new Map($$(".no", mundo).map((n) => [n.dataset.no, n]));
    const origens = new Set(D.origens.map((o) => o.id));
    const MIN = 0.14;
    const MAX = 2.2;
    const PORTA = { h: "r>l", v: "b>t" };
    const PAD = 70;
    const TOPO = 68; // espaço das etapas em cima
    const BASE = 14;

    let layout = null;
    let pronto = false;
    let caixas = {};
    let W = 0;
    let H = 0;
    let ox = 0;
    let t = { x: 0, y: 0, s: 1 };
    let ativo = null;
    let arestas = [];
    let vistaMm = null;

    const escolher = () => (innerWidth < 720 && innerHeight > innerWidth ? "v" : "h");
    const celular = () => innerWidth <= 720;

    function montar() {
      layout = escolher();
      caixa.classList.toggle("v", layout === "v");
      const L = D.layouts[layout];
      const tam = {};
      for (const [id, n] of nos) tam[id] = [n.offsetWidth, n.offsetHeight];
      let x0 = Infinity;
      let y0 = Infinity;
      let x1 = -Infinity;
      let y1 = -Infinity;
      const somar = (a, b, c, d) => {
        x0 = Math.min(x0, a);
        y0 = Math.min(y0, b);
        x1 = Math.max(x1, c);
        y1 = Math.max(y1, d);
      };
      for (const [id, [cx, cy]] of Object.entries(L.nos)) {
        const [w, h] = tam[id] ?? [0, 0];
        somar(cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2);
      }
      for (const [, fx, fy, fw, fh] of L.faixas) somar(fx, fy, fx + fw, fy + fh);
      ox = PAD - x0;
      const oy = PAD - y0;
      W = x1 - x0 + 2 * PAD;
      H = y1 - y0 + 2 * PAD;
      caixas = {};
      for (const [id, n] of nos) {
        const pos = L.nos[id];
        const [w, h] = tam[id];
        const x = pos[0] - w / 2 + ox;
        const y = pos[1] - h / 2 + oy;
        n.style.left = `${x}px`;
        n.style.top = `${y}px`;
        caixas[id] = { x, y, w, h };
      }
      faixasEl.textContent = "";
      const faixas = L.faixas.map(([r, fx, fy, fw, fh]) => ({ r, x: fx + ox, y: fy + oy, w: fw, h: fh }));
      for (const f of faixas) {
        const d = el("div", "faixa");
        Object.assign(d.style, { left: `${f.x}px`, top: `${f.y}px`, width: `${f.w}px`, height: `${f.h}px` });
        d.append(el("span", "", f.r));
        faixasEl.append(d);
      }
      mundo.style.width = `${W}px`;
      mundo.style.height = `${H}px`;
      svg.setAttribute("width", W);
      svg.setAttribute("height", H);
      desenharArestas();
      desenharMinimapa(faixas);
    }

    function porta(c, lado, o) {
      if (lado === "r") return [c.x + c.w, c.y + c.h / 2 + o, 1, 0];
      if (lado === "l") return [c.x, c.y + c.h / 2 + o, -1, 0];
      if (lado === "t") return [c.x + c.w / 2 + o, c.y, 0, -1];
      return [c.x + c.w / 2 + o, c.y + c.h, 0, 1];
    }
    function desenharArestas() {
      linhas.textContent = "";
      rotulosEl.textContent = "";
      arestas = [];
      for (const a of D.arestas) {
        const A = caixas[a.de];
        const B = caixas[a.para];
        if (!A || !B) continue;
        const [pa, pb] = (a.portas?.[layout] ?? PORTA[layout]).split(">");
        const o = a.o ?? 0;
        const [x1, y1, dx1, dy1] = porta(A, pa, o);
        const [x2, y2, dx2, dy2] = porta(B, pb, o);
        const k = Math.max(50, Math.min(Math.hypot(x2 - x1, y2 - y1) * 0.45, 240));
        const c1 = [x1 + dx1 * k, y1 + dy1 * k];
        const c2 = [x2 + dx2 * k, y2 + dy2 * k];
        const d = `M${x1},${y1} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${x2},${y2}`;
        const tipo = a.tipo ?? "principal";
        const cor = { sim: "verde", nao: "cinza", fonte: "fonte" }[tipo] ?? "ouro";
        const linha = svgEl("path", { class: `aresta ${tipo}`, d, "marker-end": `url(#seta-${cor})` });
        const fluxo = svgEl("path", { class: `fluxo ${tipo}`, d });
        linhas.append(linha, fluxo);
        let b = null;
        if (a.den) {
          const u = layout === "v" ? 0.5 + (o / 48) * 0.2 : 0.5;
          const v = 1 - u;
          const mx = v ** 3 * x1 + 3 * v * v * u * c1[0] + 3 * v * u * u * c2[0] + u ** 3 * x2;
          const my = v ** 3 * y1 + 3 * v * v * u * c1[1] + 3 * v * u * u * c2[1] + u ** 3 * y2;
          const r = el("div", `rotulo ${tipo}`);
          r.style.left = `${mx}px`;
          r.style.top = `${my}px`;
          if (a.rotulo) r.append(el("span", "", a.rotulo));
          b = el("b");
          r.append(b);
          rotulosEl.append(r);
        }
        arestas.push({ a, linha, fluxo, b, tipo });
      }
      atualizar();
    }
    /** Porcentagem de cada ligação e a grossura dela, pelo tanto de gente que passa. */
    function atualizar() {
      if (!E.A) return;
      const max = Math.max(E.A.s, 1);
      for (const { a, linha, fluxo, b } of arestas) {
        if (b) b.textContent = fmtP(valor(`${a.n}/${a.den}`, E.A));
        const w = 1.8 + 5.4 * Math.sqrt(Math.max(0, valor(a.n, E.A)) / max);
        linha.style.strokeWidth = w.toFixed(2);
        fluxo.style.strokeWidth = (w + 1.2).toFixed(2);
      }
      if (pronto) preencher(mundo);
    }

    // ----- vista: deslocamento e escala -----
    const ret = () => caixa.getBoundingClientRect();
    function area(ignorarGaveta = false) {
      const r = ret();
      let w = r.width;
      let h = r.height;
      if (!gaveta.hidden && !ignorarGaveta) {
        const g = gaveta.getBoundingClientRect();
        if (celular()) h -= Math.max(0, r.bottom - g.top);
        else w -= Math.max(0, r.right - g.left);
      }
      return { w: Math.max(w, 80), h: Math.max(h, 80) };
    }
    function aplicar() {
      mundo.style.transform = `translate(${t.x}px, ${t.y}px) scale(${t.s})`;
      let g = 26 * t.s;
      while (g < 13) g *= 2;
      caixa.style.backgroundSize = `${g}px ${g}px`;
      caixa.style.backgroundPosition = `${t.x}px ${t.y}px`;
      zoomValor.textContent = `${Math.round(t.s * 100)}%`;
      atualizarMinimapa();
    }
    function animarPara(novo) {
      caixa.classList.add("animando");
      t = novo;
      aplicar();
      clearTimeout(animarPara.fim);
      animarPara.fim = setTimeout(() => caixa.classList.remove("animando"), 340);
    }
    const limitar = (s) => Math.min(MAX, Math.max(MIN, s));
    function zoomEm(fator, px, py, suave = false) {
      const s = limitar(t.s * fator);
      const k = s / t.s;
      const novo = { x: px - (px - t.x) * k, y: py - (py - t.y) * k, s };
      if (suave) animarPara(novo);
      else {
        t = novo;
        aplicar();
      }
    }
    function ajustar(suave = true) {
      const a = area();
      const util = a.h - TOPO - BASE;
      const s = limitar(Math.min((a.w - 40) / W, util / H, 1));
      const novo = { s, x: (a.w - W * s) / 2, y: TOPO + (util - H * s) / 2 };
      if (suave) animarPara(novo);
      else {
        t = novo;
        aplicar();
      }
    }
    /** Vista de abertura: legível, começando pelas entradas. */
    function inicial() {
      const a = area();
      if (layout === "v") {
        const s = limitar(Math.min(1, (a.w - 14) / 400));
        t = { s, x: a.w / 2 - ox * s, y: TOPO - (PAD - 22) * s };
      } else {
        const fila = [...nos.entries()].filter(([, n]) => !n.classList.contains("baixo")).map(([id]) => caixas[id]);
        const y0 = Math.min(...fila.map((c) => c.y));
        const y1 = Math.max(...fila.map((c) => c.y + c.h));
        const util = a.h - TOPO - BASE;
        const s = Math.min(0.8, Math.max(0.5, util / (y1 - y0 + 90)));
        t = { s, x: 26 - (PAD - 26) * s, y: TOPO + (util - (y1 - y0) * s) / 2 - y0 * s };
      }
      aplicar();
    }
    function centralizar(id, { escala, ignorarGaveta = false } = {}) {
      const c = caixas[id];
      if (!c) return;
      const a = area(ignorarGaveta);
      const s = limitar(escala ?? Math.max(t.s, 0.78));
      const util = a.h - TOPO - BASE;
      const y = c.h * s > util ? TOPO + 4 - c.y * s : TOPO + (util - c.h * s) / 2 - c.y * s;
      animarPara({ s, x: a.w / 2 - (c.x + c.w / 2) * s, y });
    }
    function mostrar(id) {
      const c = caixas[id];
      if (!c) return;
      const a = area();
      const x0 = t.x + c.x * t.s;
      const x1 = x0 + c.w * t.s;
      const y0 = t.y + c.y * t.s;
      const y1 = y0 + c.h * t.s;
      if (x0 < 0 || x1 > a.w || y0 < TOPO || y1 > a.h) centralizar(id, { escala: t.s });
    }

    // ----- minimapa -----
    function desenharMinimapa(faixas) {
      mm.textContent = "";
      mm.setAttribute("viewBox", `0 0 ${W} ${H}`);
      for (const f of faixas) mm.append(svgEl("rect", { class: "mm-faixa", x: f.x, y: f.y, width: f.w, height: f.h, rx: 30 }));
      for (const [id, c] of Object.entries(caixas)) mm.append(svgEl("rect", { class: "mm-no", "data-mm": id, x: c.x, y: c.y, width: c.w, height: c.h, rx: 22 }));
      vistaMm = svgEl("rect", { class: "mm-vista", rx: 14 });
      mm.append(vistaMm);
      atualizarMinimapa();
    }
    function atualizarMinimapa() {
      if (!vistaMm) return;
      const a = area();
      vistaMm.setAttribute("x", -t.x / t.s);
      vistaMm.setAttribute("y", -t.y / t.s);
      vistaMm.setAttribute("width", a.w / t.s);
      vistaMm.setAttribute("height", a.h / t.s);
    }
    const mmIr = (ev) => {
      const r = mm.getBoundingClientRect();
      const a = area();
      t = { ...t, x: a.w / 2 - ((ev.clientX - r.left) / r.width) * W * t.s, y: a.h / 2 - ((ev.clientY - r.top) / r.height) * H * t.s };
      aplicar();
    };
    mm.parentElement.addEventListener("pointerdown", (ev) => {
      const quadro = mm.parentElement;
      quadro.setPointerCapture(ev.pointerId);
      mmIr(ev);
      const soltar = () => {
        quadro.removeEventListener("pointermove", mmIr);
        quadro.removeEventListener("pointerup", soltar);
      };
      quadro.addEventListener("pointermove", mmIr);
      quadro.addEventListener("pointerup", soltar);
    });

    // ----- arrastar, pinça e toque -----
    const ponteiros = new Map();
    let gesto = null;
    let alvoNo = null;
    let andou = 0;
    let ultimoToque = 0;
    let engolirClique = 0;
    addEventListener(
      "click",
      (ev) => {
        if (Date.now() - engolirClique > 600) return;
        engolirClique = 0;
        if (caixa.contains(ev.target)) return;
        ev.stopPropagation();
        ev.preventDefault();
      },
      true,
    );
    const local = (p) => {
      const r = ret();
      return { x: p.x - r.left, y: p.y - r.top };
    };
    function comecar() {
      const ps = [...ponteiros.values()].map(local);
      if (ps.length === 1) gesto = { tipo: "mover", x: ps[0].x, y: ps[0].y, t: { ...t } };
      else if (ps.length >= 2) {
        const [a, b] = ps;
        gesto = { tipo: "pinca", d: Math.hypot(a.x - b.x, a.y - b.y) || 1, meio: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, t: { ...t } };
      } else gesto = null;
    }
    const sumirAviso = () => aviso?.classList.add("some");
    caixa.addEventListener("pointerdown", (ev) => {
      if (ev.pointerType === "mouse" && ev.button !== 0) return;
      caixa.setPointerCapture(ev.pointerId);
      ponteiros.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (ponteiros.size === 1) {
        alvoNo = ev.target.closest(".no");
        andou = 0;
      } else alvoNo = null;
      comecar();
    });
    caixa.addEventListener("pointermove", (ev) => {
      if (!ponteiros.has(ev.pointerId) || !gesto) return;
      const antes = ponteiros.get(ev.pointerId);
      andou += Math.hypot(ev.clientX - antes.x, ev.clientY - antes.y);
      ponteiros.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      const ps = [...ponteiros.values()].map(local);
      if (gesto.tipo === "mover" && ps.length === 1) {
        if (andou < 4) return;
        caixa.classList.add("arrastando");
        t = { ...t, x: gesto.t.x + ps[0].x - gesto.x, y: gesto.t.y + ps[0].y - gesto.y };
        aplicar();
        sumirAviso();
      } else if (gesto.tipo === "pinca" && ps.length >= 2) {
        const [a, b] = ps;
        const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
        const meio = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
        const s = limitar(gesto.t.s * (d / gesto.d));
        const wx = (gesto.meio.x - gesto.t.x) / gesto.t.s;
        const wy = (gesto.meio.y - gesto.t.y) / gesto.t.s;
        t = { s, x: meio.x - wx * s, y: meio.y - wy * s };
        aplicar();
        sumirAviso();
      }
    });
    const soltar = (ev) => {
      if (!ponteiros.has(ev.pointerId)) return;
      const eraUm = ponteiros.size === 1 && gesto?.tipo === "mover";
      ponteiros.delete(ev.pointerId);
      caixa.classList.remove("arrastando");
      if (ev.type === "pointerup" && eraUm && andou < 6) {
        if (alvoNo) {
          // O clique que o navegador manda depois do toque cairia na gaveta que acabou de abrir.
          engolirClique = Date.now();
          abrirGaveta(alvoNo.dataset.no);
        } else {
          const agora = Date.now();
          if (agora - ultimoToque < 320) {
            const p = local({ x: ev.clientX, y: ev.clientY });
            zoomEm(1.6, p.x, p.y, true);
            ultimoToque = 0;
          } else {
            ultimoToque = agora;
            if (!gaveta.hidden) fecharGaveta();
          }
        }
      }
      alvoNo = null;
      comecar();
    };
    caixa.addEventListener("pointerup", soltar);
    caixa.addEventListener("pointercancel", soltar);
    caixa.addEventListener(
      "wheel",
      (ev) => {
        ev.preventDefault();
        sumirAviso();
        const p = local({ x: ev.clientX, y: ev.clientY });
        if (ev.ctrlKey || ev.metaKey) zoomEm(Math.exp(-ev.deltaY * 0.0095), p.x, p.y);
        else {
          const k = ev.deltaMode === 1 ? 18 : 1;
          t = { ...t, x: t.x - ev.deltaX * k, y: t.y - ev.deltaY * k };
          aplicar();
        }
      },
      { passive: false },
    );
    // Safari: pinça do trackpad.
    let gs = null;
    caixa.addEventListener("gesturestart", (ev) => {
      ev.preventDefault();
      gs = { s: t.s, ...local({ x: ev.clientX, y: ev.clientY }) };
    });
    caixa.addEventListener("gesturechange", (ev) => {
      ev.preventDefault();
      if (gs) zoomEm((gs.s * ev.scale) / t.s, gs.x, gs.y);
    });
    // Foco pelo teclado rola a caixa escondida: desfaz e leva a vista até o bloco.
    for (const c of [caixa, vista])
      c.addEventListener("scroll", () => {
        c.scrollTop = 0;
        c.scrollLeft = 0;
      });
    caixa.addEventListener("focusin", (ev) => {
      const n = ev.target.closest(".no");
      if (n && pronto && !ponteiros.size) mostrar(n.dataset.no);
    });
    for (const n of nos.values())
      n.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter" || ev.key === " ") {
          ev.preventDefault();
          abrirGaveta(n.dataset.no);
        }
      });
    for (const b of $$("[data-zoom-acao]", vista))
      b.addEventListener("click", () => {
        const a = area();
        const acao = b.dataset.zoomAcao;
        if (acao === "mais") zoomEm(1.3, a.w / 2, a.h / 2, true);
        else if (acao === "menos") zoomEm(1 / 1.3, a.w / 2, a.h / 2, true);
        else if (acao === "cem") zoomEm(1 / t.s, a.w / 2, a.h / 2, true);
        else ajustar();
      });
    const passos = $$("[data-ir]", vista);
    for (const b of passos) b.addEventListener("click", () => abrirGaveta(b.dataset.ir, { focar: true }));

    function marcar(id) {
      ativo = id;
      for (const [k, n] of nos) n.classList.toggle("ativo", k === id);
      for (const r of $$("[data-mm]", mm)) r.classList.toggle("ativo", r.dataset.mm === id);
      for (const b of passos) {
        const sim = id !== null && (b.dataset.ir === id || (origens.has(id) && origens.has(b.dataset.ir)));
        b.classList.toggle("ativo", sim);
        if (sim && b.parentElement.scrollWidth > b.parentElement.clientWidth) b.parentElement.scrollTo({ left: b.offsetLeft - (b.parentElement.clientWidth - b.offsetWidth) / 2, behavior: "smooth" });
      }
      atualizarMinimapa();
    }
    function focar(id, forte) {
      if (!pronto) return;
      if (celular()) {
        if (forte) centralizar(id, { ignorarGaveta: true });
      } else if (forte) centralizar(id);
      else mostrar(id);
    }

    // ----- ao vivo no canvas -----
    const naTela = () => pronto && E.tela === "funil" && !document.hidden && !calmo;
    const caminhos = () => new Map(arestas.map((x) => [x.a.id, x]));
    let soltos = 0;
    /** Uma pessoa passando por uma ligação: um ponto que corre de um bloco ao outro. */
    function ponto(id, para) {
      if (!naTela() || soltos > 14) return;
      const x = caminhos().get(id);
      if (!x) return;
      const comprimento = x.linha.getTotalLength();
      const c = svgEl("circle", { r: 6.5, class: `ponto ${x.tipo}` });
      pontos.append(c);
      soltos++;
      const dura = Math.max(800, Math.min(1900, comprimento * 2.6));
      const t0 = performance.now();
      const passo = (agora) => {
        const u = Math.min(1, (agora - t0) / dura);
        const e = u < 0.5 ? 2 * u * u : 1 - (-2 * u + 2) ** 2 / 2;
        const p = x.linha.getPointAtLength(comprimento * e);
        c.setAttribute("cx", p.x);
        c.setAttribute("cy", p.y);
        if (u < 1 && c.isConnected) requestAnimationFrame(passo);
        else {
          c.remove();
          soltos--;
          const n = nos.get(para);
          if (n) {
            n.classList.remove("recebe");
            void n.offsetWidth;
            n.classList.add("recebe");
          }
        }
      };
      requestAnimationFrame(passo);
    }
    /** Venda: o valor sobe por cima do bloco onde ela aconteceu. */
    function comemorar(id, texto) {
      const c = caixas[id];
      if (!c || !naTela()) return;
      const v = el("div", "voa", texto);
      v.style.left = `${c.x + c.w / 2}px`;
      v.style.top = `${c.y - 6}px`;
      rotulosEl.append(v);
      setTimeout(() => v.remove(), 2600);
    }

    function ativar() {
      if (pronto) {
        aplicar();
        return;
      }
      carregar(mundo);
      preencher(mundo);
      montar();
      inicial();
      pronto = true;
      if (ativo) focar(ativo, true);
      document.fonts?.ready.then(() => {
        const antes = { ...t };
        montar();
        t = antes;
        aplicar();
      });
      setTimeout(sumirAviso, 9000);
    }
    let ultimoLayout = null;
    if (window.ResizeObserver) new ResizeObserver(() => redimensionar()).observe(caixa);
    function redimensionar() {
      if (!pronto || E.tela !== "funil") return;
      ultimoLayout = layout;
      if (escolher() !== ultimoLayout) {
        montar();
        inicial();
        if (ativo) mostrar(ativo);
      } else aplicar();
    }
    function tecla(ev) {
      if (ev.target.closest("input, textarea, select")) return;
      const a = area();
      if (ev.key === "+" || ev.key === "=") zoomEm(1.25, a.w / 2, a.h / 2, true);
      else if (ev.key === "-") zoomEm(0.8, a.w / 2, a.h / 2, true);
      else if (ev.key === "0") ajustar();
    }
    return { ativar, atualizar, marcar, focar, redimensionar, tecla, ponto, comemorar, atualizarMinimapa };
  })();

  // ======================================================================
  // Gaveta: as métricas de uma etapa
  // ======================================================================
  function abrirGaveta(id, { focar = false, historico = true } = {}) {
    const sec = $(`[data-gaveta="${CSS.escape(id)}"]`, rolagem);
    if (!sec) return;
    for (const s of $$(".gaveta-no", rolagem)) s.hidden = s !== sec;
    gaveta.hidden = false;
    gaveta.style.transform = "";
    raiz.classList.add("com-gaveta");
    rolagem.scrollTop = 0;
    carregar(sec);
    animar = false;
    preencher(sec);
    graficos(sec);
    animar = true;
    canvas.marcar(id);
    if (historico) history.replaceState(null, "", `#funil/${id}`);
    canvas.focar(id, focar);
  }
  function fecharGaveta({ historico = true } = {}) {
    if (gaveta.hidden) return;
    gaveta.hidden = true;
    raiz.classList.remove("com-gaveta");
    canvas.marcar(null);
    if (historico && E.tela === "funil") history.replaceState(null, "", "#funil");
  }
  $("#gaveta-fechar").addEventListener("click", () => fecharGaveta());
  // Puxar a alça pra baixo fecha a gaveta (celular).
  const alca = $("#gaveta-alca");
  let puxada = null;
  alca.addEventListener("pointerdown", (ev) => {
    alca.setPointerCapture(ev.pointerId);
    puxada = { y: ev.clientY, dy: 0 };
  });
  alca.addEventListener("pointermove", (ev) => {
    if (!puxada) return;
    puxada.dy = Math.max(0, ev.clientY - puxada.y);
    gaveta.style.transform = `translateY(${puxada.dy}px)`;
  });
  const largar = () => {
    if (!puxada) return;
    if (puxada.dy > 110) fecharGaveta();
    gaveta.style.transform = "";
    puxada = null;
  };
  alca.addEventListener("pointerup", largar);
  alca.addEventListener("pointercancel", largar);

  // ======================================================================
  // Telas, período, projeto
  // ======================================================================
  // A lateral recolhe pra só os ícones: quando a pessoa pede (fica guardado), sempre nas telas médias e, por padrão,
  // na tela do canvas. Lá o botão ainda abre, sem mexer no que está guardado, e ela volta a recolher na próxima entrada.
  const LARGURA = { media: matchMedia("(max-width: 1240px)"), celular: matchMedia("(max-width: 720px)") };
  const lateralBotao = $("#lateral-botao");
  let abriuNoCanvas = false;
  function recolher() {
    const noCanvas = E.tela === "funil";
    const fina = !LARGURA.celular.matches && (LARGURA.media.matches || (noCanvas ? !abriuNoCanvas : E.recolhida));
    const primeira = !recolher.feito;
    recolher.feito = true;
    lateralBotao.setAttribute("aria-expanded", String(!fina));
    lateralBotao.setAttribute("aria-label", fina ? "Expandir a navegação" : "Recolher a navegação");
    if (!primeira && fina === raiz.classList.contains("trilho")) return;
    // Só desliza na tela do canvas, que acompanha a largura. Nas outras é na hora, pra tela já nascer na largura final.
    if (primeira || !noCanvas) {
      raiz.classList.add("seco");
      requestAnimationFrame(() => requestAnimationFrame(() => raiz.classList.remove("seco")));
    }
    raiz.classList.toggle("trilho", fina);
    if (!primeira && !noCanvas) aoMudarLargura();
  }
  for (const m of Object.values(LARGURA)) m.addEventListener("change", recolher);
  lateralBotao.addEventListener("click", () => {
    if (E.tela === "funil") abriuNoCanvas = !abriuNoCanvas;
    else {
      E.recolhida = !E.recolhida;
      lembrar();
    }
    recolher();
  });
  function rota() {
    let h = "";
    try {
      h = decodeURIComponent(location.hash.slice(1));
    } catch {}
    const [nome, no] = h.split("/");
    const id = telas[nome] ? nome : "geral";
    const mudou = E.tela !== id;
    if (mudou) abriuNoCanvas = false;
    E.tela = id;
    for (const [k, t] of Object.entries(telas)) t.hidden = k !== id;
    for (const a of $$("[data-tela]")) a.classList.toggle("ativo", a.dataset.tela === id);
    raiz.dataset.tela = id;
    recolher();
    $("#tela-titulo").textContent = D.telas[id];
    if (id === "funil") {
      canvas.ativar();
      if (mudou) pintar(true);
      if (no) abrirGaveta(no, { focar: true, historico: false });
      else fecharGaveta({ historico: false });
    } else {
      fecharGaveta({ historico: false });
      if (mudou) {
        scrollTo(0, 0);
        pintar(true);
      }
    }
  }
  for (const b of $$("[data-periodo]"))
    b.addEventListener("click", () => {
      E.periodo = b.dataset.periodo;
      lembrar();
      textosDoPeriodo();
      recalcular();
      for (const g of $$(".grafico")) g._sobre = false;
      pintar(true);
    });
  const contaBotao = $("#conta");
  const contaMenu = $("#conta-menu");
  const fecharMenu = () => {
    contaMenu.hidden = true;
    contaBotao.setAttribute("aria-expanded", "false");
  };
  contaBotao.addEventListener("click", (ev) => {
    ev.stopPropagation();
    contaMenu.hidden = !contaMenu.hidden;
    contaBotao.setAttribute("aria-expanded", String(!contaMenu.hidden));
  });
  document.addEventListener("click", (ev) => {
    if (!contaMenu.hidden && !contaMenu.contains(ev.target)) fecharMenu();
  });
  for (const b of $$("[data-conta-id]"))
    b.addEventListener("click", () => {
      fecharMenu();
      if (b.dataset.contaId === E.conta.id) return;
      E.conta = D.contas.find((c) => c.id === b.dataset.contaId);
      lembrar();
      textosDaConta();
      zerarVivo();
      recalcular();
      pintar(true);
    });
  const vivoBotao = $("#vivo-botao");
  vivoBotao.addEventListener("click", () => {
    vivo.ligado = !vivo.ligado;
    vivoBotao.setAttribute("aria-pressed", String(vivo.ligado));
    raiz.classList.toggle("vivo-parado", !vivo.ligado);
    $("[data-vivo-rotulo]").textContent = vivo.ligado ? "agora" : "em pausa";
  });
  for (const b of $$("[data-copiar]"))
    b.addEventListener("click", async () => {
      const rotulo = b.querySelector("span");
      try {
        await navigator.clipboard.writeText(`https://${E.conta.dominio}/${b.dataset.copiar}`);
        rotulo.textContent = "Copiado";
      } catch {
        rotulo.textContent = "Não deu";
      }
      setTimeout(() => (rotulo.textContent = "Copiar"), 1600);
    });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") {
      if (!contaMenu.hidden) fecharMenu();
      else fecharGaveta();
    } else if (E.tela === "funil") canvas.tecla(ev);
  });
  let adiado = 0;
  function aoMudarLargura() {
    canvas.redimensionar();
    clearTimeout(adiado);
    adiado = setTimeout(() => {
      for (const g of $$(".grafico")) g._sobre = false;
      graficos(telas[E.tela]);
      if (!gaveta.hidden) graficos($(".gaveta-no:not([hidden])", rolagem));
      preencher(telas[E.tela]);
    }, 160);
  }
  addEventListener("resize", aoMudarLargura);
  addEventListener("hashchange", rota);

  textosDaConta();
  textosDoPeriodo();
  zerarVivo();
  sujo = false;
  recalcular();
  rota();
};
</script><script>
(() => {
  const CFG = {"sal":"nhYlrvFhny3JHgB2I9REUA==","rodadas":600000,"pagina":"386c993e1a70808f5c722314","base":"../"};
  const LEMBRAR = "mr_chave";
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  let CHAVE = null;
  const decifrar = async (buf) => crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, CHAVE, buf.slice(12));
  const baixar = async (n) => {
    const r = await fetch(CFG.base + "c/" + n + ".bin");
    if (!r.ok) throw new Error("arquivo " + r.status);
    return r.arrayBuffer();
  };
  const cache = new Map();
  window.revisaoImagem = (ref) => {
    if (!ref || !ref.startsWith("c:")) return Promise.resolve(ref);
    const n = ref.slice(2);
    if (!cache.has(n))
      cache.set(n, baixar(n).then(decifrar).then((d) => URL.createObjectURL(new Blob([d], { type: "image/webp" }))));
    return cache.get(n);
  };

  async function derivar(senha) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(CFG.sal), iterations: CFG.rodadas, hash: "SHA-256" },
      base,
      { name: "AES-GCM", length: 256 },
      true,
      ["decrypt"],
    );
  }

  async function entrar(chave) {
    CHAVE = chave;
    const html = new TextDecoder().decode(await decifrar(await baixar(CFG.pagina)));
    document.getElementById("portao").remove();
    document.getElementById("conteudo").innerHTML = html;
    const vistas = new IntersectionObserver(
      (es) => {
        for (const e of es) {
          if (!e.isIntersecting) continue;
          // Numa fileira que rola de lado, já decifra a fileira toda.
          const fileira = e.target.closest(".galeria, .grade, .celulares, .canvas-mundo");
          for (const el of fileira ? fileira.querySelectorAll("[data-c],[data-cposter]") : [e.target]) {
            vistas.unobserve(el);
            if (el.dataset.c && !el.src) window.revisaoImagem("c:" + el.dataset.c).then((u) => (el.src = u));
            if (el.dataset.cposter && !el.poster) window.revisaoImagem("c:" + el.dataset.cposter).then((u) => (el.poster = u));
          }
        }
      },
      { rootMargin: "900px 0px" },
    );
    for (const el of document.querySelectorAll("[data-c],[data-cposter]")) vistas.observe(el);
    window.iniciarRevisao();
  }

  const form = document.querySelector("#portao form");
  const erro = document.querySelector("#portao .erro");
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const botao = form.querySelector("button");
    botao.disabled = true;
    botao.textContent = "Abrindo…";
    erro.textContent = "";
    try {
      const chave = await derivar(form.senha.value);
      await entrar(chave);
      if (form.lembrar.checked) {
        try {
          const bruta = new Uint8Array(await crypto.subtle.exportKey("raw", chave));
          localStorage.setItem(LEMBRAR, JSON.stringify({ sal: CFG.sal, k: btoa(String.fromCharCode(...bruta)) }));
        } catch {}
      }
    } catch {
      CHAVE = null;
      erro.textContent = "Senha errada. Tenta de novo.";
      botao.disabled = false;
      botao.textContent = "Entrar";
      form.senha.select();
    }
  });

  // Quem marcou "lembrar" entra direto, enquanto a página não for cifrada de novo.
  (async () => {
    try {
      const salvo = JSON.parse(localStorage.getItem(LEMBRAR) || "null");
      if (!salvo || salvo.sal !== CFG.sal) return;
      const chave = await crypto.subtle.importKey("raw", b64(salvo.k), "AES-GCM", false, ["decrypt"]);
      await entrar(chave);
    } catch {
      CHAVE = null;
      try {
        localStorage.removeItem(LEMBRAR);
      } catch {}
    }
  })();
})();</script></body></html>
